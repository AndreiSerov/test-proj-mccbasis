# Works with Docker (`docker compose`) and Podman (`podman compose`).
# Dev defaults so it runs with no setup; override any of them from the shell.
x-app: &app
  build: .
  environment:
    - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-payments}:${POSTGRES_PASSWORD:-payments}@postgres:5432/${POSTGRES_DB:-payments}
    - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    - API_KEY=${API_KEY:-dev-api-key}
    # Bare names: forwarded from the shell only when set; otherwise Settings defaults apply.
    - EMULATOR_MIN_DELAY
    - EMULATOR_MAX_DELAY
    - EMULATOR_SUCCESS_RATE
    - RETRY_DELAYS
    - WEBHOOK_TIMEOUT
    # The demo sink lives on a private address, so it is allowlisted by default.
    - WEBHOOK_ALLOWED_HOSTS=${WEBHOOK_ALLOWED_HOSTS:-webhook-sink}
    - CONSUMER_CONCURRENCY
    - RELAY_BATCH_SIZE
    - RELAY_POLL_INTERVAL
    - RELAY_PUBLISH_TIMEOUT
    - GRACEFUL_TIMEOUT

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payments}
      POSTGRES_DB: ${POSTGRES_DB:-payments}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: docker.io/library/rabbitmq:3-management-alpine
    ports:
      - "15672:15672"
    # Not `rabbitmq-diagnostics ping`: it runs as root and, under Podman, can create
    # the Erlang cookie before the broker does, leaving it unreadable to RabbitMQ.
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5672"]
      interval: 5s
      timeout: 10s
      retries: 20

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on: &ready
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  consumer:
    <<: *app
    command: ["faststream", "run", "payments.consumer.app:app_factory", "--factory"]
    # On SIGTERM: Relay stop (up to 5 s), then in-flight messages finish
    # (up to GRACEFUL_TIMEOUT, default 30 s), plus margin.
    stop_grace_period: 45s
    depends_on: *ready

  # Demo only (`--profile demo`): logs every request, answers 500 on `?fail=1`.
  webhook-sink:
    build: .
    profiles: [demo]
    command: ["uvicorn", "payments.demo.webhook_sink:app_factory", "--factory", "--host", "0.0.0.0", "--port", "9000"]

volumes:
  postgres-data:
